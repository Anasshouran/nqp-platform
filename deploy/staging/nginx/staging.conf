# ============================================================
# deploy/staging/nginx/staging.conf — template; replace <staging-host> at deploy
# time with the owner-approved staging DNS name. TLS-only (no :80 listener).
# ============================================================

upstream staging_backend { server backend:8000; }
upstream staging_frontend { server frontend:80; }

server {
    listen 443 ssl;
    http2 on;
    server_name <staging-host>; # e.g. staging.<domain> — MUST be the owner-approved host
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # HSTS for SPA responses (Django already sets it on /admin and /api).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Django static assets (collectstatic output mounted from the shared volume).
    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Uploaded media (shared volume, persistent across container recreation).
    location /media/ {
        alias /media/;
        expires 7d;
    }

    # API + admin -> Django. X-Forwarded-Proto tells Django the request is
    # HTTPS (its SecurityMiddleware enforces SECURE_SSL_REDIRECT / HSTS).
    location /api/ {
        proxy_pass http://staging_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://staging_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA.
    location / {
        proxy_pass http://staging_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}