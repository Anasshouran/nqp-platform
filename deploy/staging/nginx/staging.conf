# deploy/staging/nginx/staging.conf — template; replace <staging-host> at deploy time.
upstream staging_backend { server backend:8000; }
upstream staging_frontend { server frontend:80; }

server {
    listen 443 ssl http2;
    server_name <staging-host>; # e.g. staging.<domain> — MUST be the owner-approved host
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    location /api/ { proxy_pass http://staging_backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /admin/ { proxy_pass http://staging_backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location / { proxy_pass http://staging_frontend; proxy_set_header Host $host; }
}
