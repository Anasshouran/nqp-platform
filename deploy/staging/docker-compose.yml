# ============================================================
# deploy/staging/docker-compose.yml — AFYATNA/NQP staging stack
# Isolated non-production stack. Container names: nqp-staging-*
#
# Release identity contract (F-03):
#   STAGING_BACKEND_IMAGE  = ghcr.io/anasshouran/nqp-backend:<RELEASE_SHA>
#   STAGING_FRONTEND_IMAGE = ghcr.io/anasshouran/afyatna-frontend:<RELEASE_SHA>
# Both images MUST carry the same immutable <RELEASE_SHA>. No `latest`.
# Rollback = re-pin both variables to a previously known-good <RELEASE_SHA>.
#
# Interpolation env: deploy/staging/.env (copy for real values; NEVER commit).
# This stack NEVER points at production DB/Redis/volumes.
# ============================================================

services:
  postgres:
    image: ${STAGING_POSTGRES_IMAGE:-ghcr.io/anasshouran/postgres:16-alpine}
    container_name: nqp-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STAGING_DB_NAME}
      POSTGRES_USER: ${STAGING_DB_USER}
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD}
    volumes:
      - staging-postgres-data:/var/lib/postgresql/data
    networks:
      - staging-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: ${STAGING_REDIS_IMAGE:-ghcr.io/anasshouran/redis:7-alpine}
    container_name: nqp-staging-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - staging-redis-data:/data
    networks:
      - staging-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    image: ${STAGING_BACKEND_IMAGE:?STAGING_BACKEND_IMAGE is required — immutable GHCR tag, e.g. ghcr.io/anasshouran/nqp-backend:<RELEASE_SHA>}
    container_name: nqp-staging-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DEBUG: "False"
      POSTGRES_DB: ${STAGING_DB_NAME}
      POSTGRES_USER: ${STAGING_DB_USER}
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ALLOWED_HOSTS: ${STAGING_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${STAGING_CSRF_TRUSTED_ORIGINS}
      CORS_ALLOWED_ORIGINS: ${STAGING_CORS_ALLOWED_ORIGINS}
      SECRET_KEY: ${STAGING_SECRET_KEY}
      JWT_SECRET_KEY: ${STAGING_JWT_SECRET_KEY}
      SECURE_SSL_REDIRECT: "True"
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SECURE: "True"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-nqp-staging}
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        exec gunicorn --bind 0.0.0.0:8000 nqp_backend.wsgi:application
      "
    volumes:
      - staging-static-data:/app/static
      - staging-media-data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - staging-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=5); sys.exit(0 if r.status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery:
    image: ${STAGING_BACKEND_IMAGE:?STAGING_BACKEND_IMAGE is required — immutable GHCR tag, e.g. ghcr.io/anasshouran/nqp-backend:<RELEASE_SHA>}
    container_name: nqp-staging-celery
    restart: unless-stopped
    env_file: .env
    environment:
      DEBUG: "False"
      POSTGRES_DB: ${STAGING_DB_NAME}
      POSTGRES_USER: ${STAGING_DB_USER}
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ALLOWED_HOSTS: ${STAGING_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${STAGING_CSRF_TRUSTED_ORIGINS}
      CORS_ALLOWED_ORIGINS: ${STAGING_CORS_ALLOWED_ORIGINS}
      SECRET_KEY: ${STAGING_SECRET_KEY}
      JWT_SECRET_KEY: ${STAGING_JWT_SECRET_KEY}
      SECURE_SSL_REDIRECT: "True"
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SECURE: "True"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-nqp-staging}
    command: ["celery", "-A", "nqp_backend", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - staging-net

  celery-beat:
    image: ${STAGING_BACKEND_IMAGE:?STAGING_BACKEND_IMAGE is required — immutable GHCR tag, e.g. ghcr.io/anasshouran/nqp-backend:<RELEASE_SHA>}
    container_name: nqp-staging-celery-beat
    restart: unless-stopped
    env_file: .env
    environment:
      DEBUG: "False"
      POSTGRES_DB: ${STAGING_DB_NAME}
      POSTGRES_USER: ${STAGING_DB_USER}
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ALLOWED_HOSTS: ${STAGING_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${STAGING_CSRF_TRUSTED_ORIGINS}
      CORS_ALLOWED_ORIGINS: ${STAGING_CORS_ALLOWED_ORIGINS}
      SECRET_KEY: ${STAGING_SECRET_KEY}
      JWT_SECRET_KEY: ${STAGING_JWT_SECRET_KEY}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-nqp-staging}
    command: ["celery", "-A", "nqp_backend", "beat", "--loglevel=info"]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - staging-net

  frontend:
    image: ${STAGING_FRONTEND_IMAGE:?STAGING_FRONTEND_IMAGE is required — same <RELEASE_SHA> as the backend image, e.g. ghcr.io/anasshouran/afyatna-frontend:<RELEASE_SHA>}
    container_name: nqp-staging-frontend
    restart: unless-stopped
    networks:
      - staging-net

  nginx:
    image: nginx:1.27-alpine
    container_name: nqp-staging-nginx
    restart: unless-stopped
    # Port-443 ownership: the HOST nginx (Let's Encrypt front for afyatna.com,
    # api-dev.afyatna.com, dev.afyatna.com) exclusively binds 0.0.0.0:443 and
    # [::]:443. The staging nginx MUST NOT publish to host 443 — that mapping
    # would fail to start and could hijack the public TLS front. Staging TLS is
    # reached over the loopback on an internal port; public route is host
    # nginx -> internal staging upstream (see nginx/staging.conf template).
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
      - staging-static-data:/static:ro
      - staging-media-data:/media:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - staging-net

networks:
  staging-net:
    name: nqp-staging-net

volumes:
  staging-postgres-data:
  staging-redis-data:
  staging-static-data:
  staging-media-data: