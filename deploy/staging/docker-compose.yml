# deploy/staging — AFYATNA/NQP staging stack (isolated from development).
# NOTE: This stack is NOT running until owner supplies staging host + secrets.
# NEVER point at production DB/Redis/volumes. Container names use nqp-staging-*.
services:
  postgres:
    image: ghcr.io/anasshouran/postgres:16-alpine
    container_name: nqp-staging-postgres
    environment:
      POSTGRES_DB: ${STAGING_DB_NAME}
      POSTGRES_USER: ${STAGING_DB_USER}
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD}
    volumes:
      - staging-postgres-data:/var/lib/postgresql/data
    networks:
      - staging-net

  redis:
    image: ghcr.io/anasshouran/redis:7-alpine
    container_name: nqp-staging-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - staging-redis-data:/data
    networks:
      - staging-net

  backend:
    image: ${STAGING_BACKEND_IMAGE:-ghcr.io/anasshouran/nqp-backend:latest}
    container_name: nqp-staging-backend
    env_file: .env
    environment:
      DEBUG: "False"
      POSTGRES_DB: ${STAGING_DB_NAME}
      POSTGRES_USER: ${STAGING_DB_USER}
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ALLOWED_HOSTS: ${STAGING_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${STAGING_CSRF_TRUSTED_ORIGINS}
      CORS_ALLOWED_ORIGINS: ${STAGING_CORS_ALLOWED_ORIGINS}
      SECRET_KEY: ${STAGING_SECRET_KEY}
      JWT_SECRET_KEY: ${STAGING_JWT_SECRET_KEY}
      SECURE_SSL_REDIRECT: "True"
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SECURE: "True"
    depends_on:
      - postgres
      - redis
    networks:
      - staging-net

  frontend:
    image: ${STAGING_FRONTEND_IMAGE:-ghcr.io/anasshouran/afyatna-frontend:latest}
    container_name: nqp-staging-frontend
    environment:
      VITE_API_URL: "/api/v1"
    networks:
      - staging-net

  nginx:
    image: nginx:1.27-alpine
    container_name: nqp-staging-nginx
    ports:
      - "443:443"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      - backend
      - frontend
    networks:
      - staging-net

networks:
  staging-net:
    name: nqp-staging-net

volumes:
  staging-postgres-data:
  staging-redis-data:
