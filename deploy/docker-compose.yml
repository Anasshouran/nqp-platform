# ============================================================
# docker-compose.yml - تشغيل جميع خدمات منصة AFYATNA
# بيئة: التطوير المحلي (Development) والاختبار (Staging)
# ============================================================

services:
  # ===== قاعدة البيانات (PostgreSQL) =====
  db:
    image: ${POSTGRES_IMAGE:-ghcr.io/anasshouran/postgres:16-alpine}
    container_name: afyatna-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afyatna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-afyatna}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afyatna} -d ${POSTGRES_DB:-afyatna}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - afyatna

  # ===== التخزين المؤقت (Redis) =====
  redis:
    image: redis:7-alpine
    container_name: afyatna-redis-dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep PONG; else redis-cli ping | grep PONG; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - afyatna

  # ===== تخزين الملفات (MinIO) =====
  minio:
    image: minio/minio:latest
    container_name: afyatna-minio-dev
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - afyatna

  # ===== الخادم الخلفي (Backend - Django + Gunicorn) =====
  backend:
    image: ghcr.io/anasshouran/afyatna-backend:dev
    container_name: afyatna-backend-dev
    restart: unless-stopped
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-development}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-afyatna}
      POSTGRES_USER: ${POSTGRES_USER:-afyatna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-afyatna}
      DB_USER: ${POSTGRES_USER:-afyatna}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-nqp-documents}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-jwt-secret-key-here}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ../backend:/app
      - ../backend/static:/app/static
      - ../backend/media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn --workers=4 --threads=2 --bind=0.0.0.0:8000 nqp_backend.wsgi:application
      "
    networks:
      - afyatna

  # ===== الخادم الأمامي (Frontend - React + Nginx) =====
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: afyatna-frontend-dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - afyatna

  # ===== المهام الخلفية (Celery Worker) =====
  celery:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: afyatna-celery
    restart: unless-stopped
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-development}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-afyatna}
      POSTGRES_USER: ${POSTGRES_USER:-afyatna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-afyatna}
      DB_USER: ${POSTGRES_USER:-afyatna}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here}
    volumes:
      - ../backend:/app
      - ../backend/static:/app/static
      - ../backend/media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: celery -A nqp_backend worker --loglevel=info --concurrency=4
    networks:
      - afyatna

  # ===== جدولة المهام (Celery Beat) =====
  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: afyatna-celery-beat
    restart: unless-stopped
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-development}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-afyatna}
      POSTGRES_USER: ${POSTGRES_USER:-afyatna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-afyatna}
      DB_USER: ${POSTGRES_USER:-afyatna}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here}
    volumes:
      - ../backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A nqp_backend beat --loglevel=info
    networks:
      - afyatna

  # ===== عكس الخادم (Nginx Reverse Proxy) =====
  nginx:
    image: nginx:alpine
    container_name: afyatna-nginx-dev
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ../backend/static:/static:ro
      - ../backend/media:/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - afyatna

# ===== الشبكات =====
networks:
  afyatna:
    driver: bridge

# ===== وحدات التخزين (Volumes) =====
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local