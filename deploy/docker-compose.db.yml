# ============================================================
# docker-compose.db.yml - تشغيل قاعدة البيانات فقط
# بيئة: التطوير المحلي (لتشغيل قاعدة البيانات بشكل منفصل)
# ============================================================

services:
  # ===== قاعدة البيانات (PostgreSQL) =====
  postgres:
    image: ${POSTGRES_IMAGE:-ghcr.io/anasshouran/postgres:16-alpine}
    container_name: afyatna-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afyatna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-afyatna}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afyatna} -d ${POSTGRES_DB:-afyatna}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - afyatna

  # ===== التخزين المؤقت (Redis) =====
  redis:
    image: redis:7-alpine
    container_name: afyatna-redis-dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - afyatna

# ===== الشبكات =====
networks:
  afyatna:
    driver: bridge

# ===== وحدات التخزين (Volumes) =====
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local