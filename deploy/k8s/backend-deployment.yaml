# ============================================================
# k8s/backend-deployment.yaml - Backend Deployment
# بيئة: الإنتاج (Production)
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: nqp
  labels:
    app: backend
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: backend
        image: ghcr.io/nqp/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DJANGO_ENV
          value: "production"
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: nqp-secrets
              key: db-name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: nqp-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nqp-secrets
              key: db-password
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nqp-secrets
              key: redis-password
        - name: MINIO_ENDPOINT
          value: "minio-service:9000"
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: nqp-secrets
              key: minio-access-key
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: nqp-secrets
              key: minio-secret-key
        - name: MINIO_BUCKET
          value: "nqp-documents"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: nqp-secrets
              key: secret-key
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: nqp-secrets
              key: jwt-secret
        - name: DEBUG
          value: "False"
        - name: ALLOWED_HOSTS
          value: "api.nqp.gov.sd,nqp.gov.sd"
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /api/v1/health/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health/
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: static-storage
          mountPath: /app/static
        - name: media-storage
          mountPath: /app/media
      volumes:
      - name: static-storage
        persistentVolumeClaim:
          claimName: nqp-static-pvc
      - name: media-storage
        persistentVolumeClaim:
          claimName: nqp-media-pvc