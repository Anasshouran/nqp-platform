# ============================================================
# k8s/redis-deployment.yaml - Redis Deployment
# بيئة: الإنتاج (Production)
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  namespace: nqp
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nqp-secrets
              key: redis-password
        command:
        - redis-server
        - --appendonly
        - "yes"
        - --requirepass
        - "$(REDIS_PASSWORD)"
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - 'redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep -q PONG'
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - 'redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep -q PONG'
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: redis-storage
          mountPath: /data
      volumes:
      - name: redis-storage
        persistentVolumeClaim:
          claimName: nqp-redis-pvc