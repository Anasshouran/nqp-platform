# ============================================================
# k8s/minio-service.yaml - MinIO Service
# بيئة: الإنتاج (Production)
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: nqp
  labels:
    app: minio
spec:
  selector:
    app: minio
  ports:
  - port: 9000
    targetPort: 9000
    name: api
  - port: 9001
    targetPort: 9001
    name: console
  type: ClusterIP