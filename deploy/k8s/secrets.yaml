# ============================================================
# k8s/secrets.yaml - Kubernetes Secrets
# بيئة: الإنتاج (Production)
# ============================================================
# ⚠️  تحذير أمني: هذا الملف يحتوي فقط على placeholders.
#     يجب استبدال القيم الحقيقية عبر:
#       kubectl create secret generic nqp-secrets --namespace=nqp \
#         --from-literal=db-name=nqp_db \
#         --from-literal=db-user=<USER> \
#         --from-literal=db-password=<PASSWORD> \
#         --from-literal=secret-key=<DJANGO_SECRET_KEY> \
#         --from-literal=jwt-secret=<JWT_SECRET_KEY> \
#         --from-literal=redis-password=<REDIS_PASSWORD> \
#         --from-literal=minio-access-key=<MINIO_ACCESS_KEY> \
#         --from-literal=minio-secret-key=<MINIO_SECRET_KEY>
#
#     أو عبر External Secrets Operator / Sealed Secrets في الإنتاج.

apiVersion: v1
kind: Secret
metadata:
  name: nqp-secrets
  namespace: nqp
type: Opaque
data:
  # قاعدة البيانات — استبدل القيم بـ base64 من بيئتك
  db-name: bnFwX2Ri             # base64(nqp_db)
  db-user: REPLACE_ME_BASE64    # base64(<YOUR_DB_USER>)
  db-password: REPLACE_ME_BASE64 # base64(<YOUR_DB_PASSWORD>)
  # Django
  secret-key: REPLACE_ME_BASE64  # base64(<YOUR_DJANGO_SECRET_KEY>)
  # JWT
  jwt-secret: REPLACE_ME_BASE64  # base64(<YOUR_JWT_SECRET_KEY>)
  # Redis
  redis-password: REPLACE_ME_BASE64  # base64(<YOUR_REDIS_PASSWORD>)
  # MinIO
  minio-access-key: REPLACE_ME_BASE64  # base64(<YOUR_MINIO_ACCESS_KEY>)
  minio-secret-key: REPLACE_ME_BASE64  # base64(<YOUR_MINIO_SECRET_KEY>)

# شهادة TLS: لا تُضمَّن في ملف المانيفست لأنها تفشل عند `kubectl apply`.
# أنشئ Secret من شهادات deploy/ssl عبر السكربت:
#   ./deploy/k8s/create-tls-secret.sh
# أو يدوياً:
#   kubectl create secret tls nqp-tls --namespace=nqp \
#     --cert=deploy/ssl/fullchain.pem --key=deploy/ssl/privkey.pem
# ملاحظة: كشف المفتاح الخاص داخل المانيفست يعد تسريباً سرياً — تجنبه.
