# ============================================================
# k8s/ingress.yaml - Nginx Ingress
# بيئة: الإنتاج (Production)
# ============================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nqp-ingress
  namespace: nqp
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers: "4 16k"
spec:
  tls:
  - hosts:
    - nqp.gov.sd
    - api.nqp.gov.sd
    - www.nqp.gov.sd
    secretName: nqp-tls
  rules:
  - host: nqp.gov.sd
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8000
      - path: /admin/
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8000
      - path: /static/
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8000
  - host: api.nqp.gov.sd
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8000