# ============================================================
# k8s/backend-service.yaml - Backend Service
# بيئة: الإنتاج (Production)
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: nqp
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP