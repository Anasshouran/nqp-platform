# ============================================================
# k8s/frontend-deployment.yaml - Frontend Deployment
# بيئة: الإنتاج (Production)
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: nqp
  labels:
    app: frontend
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/nqp/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        # ملاحظة: Vite يبني المتغيرات (VITE_*) وقت البناء وليس وقت التشغيل.
        # عنوان API مُثبّت في الصورة عبر frontend/.env.production
        # (VITE_API_URL=https://api.nqp.gov.sd/api/v1). متغيرات وقت التشغيل هنا لا تُقرأ.
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2