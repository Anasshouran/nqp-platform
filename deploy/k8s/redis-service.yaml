# ============================================================
# k8s/redis-service.yaml - Redis Service
# بيئة: الإنتاج (Production)
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: nqp
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  type: ClusterIP