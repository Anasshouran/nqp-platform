# ============================================================
# k8s/celery-deployment.yaml - Celery Worker Deployment
# بيئة: الإنتاج (Production)
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-deployment
  namespace: nqp
  labels:
    app: celery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery
  template:
    metadata:
      labels:
        app: celery
    spec:
      containers:
      - name: celery
        image: ghcr.io/nqp/backend:latest
        imagePullPolicy: Always
        command:
        - celery
        - -A
        - nqp_backend
        - worker
        - --loglevel=info
        - --concurrency=4
        env:
        - name: DJANGO_ENV
          value: "production"
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: nqp-secrets
              key: db-name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: nqp-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nqp-secrets
              key: db-password
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nqp-secrets
              key: redis-password
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: nqp-secrets
              key: secret-key
        - name: MINIO_ENDPOINT
          value: "minio-service:9000"
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: nqp-secrets
              key: minio-access-key
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: nqp-secrets
              key: minio-secret-key
        - name: MINIO_BUCKET
          value: "nqp-documents"
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "2Gi"