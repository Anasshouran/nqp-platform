# ============================================================
# nginx.conf - تكوين Nginx الرئيسي (Reverse Proxy - Production)
# يُركَّب كملف إعدادات رئيسي: /etc/nginx/nginx.conf
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {

    # الحد الأقصى لحجم الملفات المرفوعة (عريض، صور، مرفقات) — 100 ميجابايت
    client_max_body_size 100m;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # تعريف خوادم الواجهة (Upstreams)
    upstream frontend_server {
        server frontend:80 fail_timeout=5s max_fails=3;
        keepalive 32;
    }

    # إعادة توجيه HTTP إلى HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ===== الملفات الثابتة =====
        location /static/ {
            alias /static/;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # ===== الملفات المرفوعة =====
        location /media/ {
            alias /media/;
            expires 30d;
        }

        # ===== Forward Proxy إلى الواجهة الأمامية =====
        location / {
            proxy_pass http://frontend_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_read_timeout 60s;
        }
    }
}