# ============================================================
# nginx.dev.conf - تكوين Nginx للتطوير المحلي
# يُركَّب كملف إعدادات رئيسي: /etc/nginx/nginx.conf
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {

    # الحد الأقصى لحجم الملفات المرفوعة (عريض، صور، مرفقات) — 100 ميجابايت
    client_max_body_size 100m;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 80;
        server_name localhost nqp.local;

        # ===== الملفات الثابتة =====
        location /static/ {
            alias /static/;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # ===== الملفات المرفوعة =====
        location /media/ {
            alias /media/;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # ===== واجهات API (Backend - منفذ 8000) =====
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 60s;
        }

        # ===== لوحة إدارة Django =====
        location /admin/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # فحص الصحة
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # ===== Frontend (React - منفذ 3000) =====
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }
}