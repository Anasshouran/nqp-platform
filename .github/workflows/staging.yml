name: Staging — Build, Publish & Deploy

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/anasshouran
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'
  STAGING_HOST: ${{ vars.STAGING_HOST }}
  STAGING_USER: ${{ vars.STAGING_USER }}

jobs:
  backend-tests:
    name: Backend — Django tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nqp_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: 'False'
      DB_NAME: nqp_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: '5432'
      REDIS_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt
      - name: Run migrations check
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python -m pytest apps -q --reuse-db

  frontend-checks:
    name: Frontend — typecheck + lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  build-backend-image:
    name: Build & publish backend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [backend-tests]
    outputs:
      image_tag: ${{ steps.tags.outputs.image_tag }}
      image_sha: ${{ steps.tags.outputs.image_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "image_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/nqp-backend:staging
            ${{ env.IMAGE_NAMESPACE }}/nqp-backend:${{ steps.tags.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to staging VPS
    runs-on: ubuntu-latest
    needs: [build-backend-image]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/staging_deploy_key
          chmod 600 ~/.ssh/staging_deploy_key
          ssh-keyscan -H ${{ vars.STAGING_HOST }} >> ~/.ssh/known_hosts
      - name: Deploy to staging
        env:
          SSH_KEY_PATH: ~/.ssh/staging_deploy_key
          IMAGE_TAG: ${{ needs.build-backend-image.outputs.image_tag }}
        run: |
          ssh -i "$SSH_KEY_PATH" -o StrictHostKeyChecking=yes \
            ${{ vars.STAGING_USER }}@${{ vars.STAGING_HOST }} \
            "cd /opt/nqp-platform/deploy/staging && \
             echo \"Deploying image: ghcr.io/anasshouran/nqp-backend:${IMAGE_TAG}\" && \
             export STAGING_BACKEND_IMAGE=ghcr.io/anasshouran/nqp-backend:${IMAGE_TAG} && \
             docker compose --env-file .env -f docker-compose.yml pull backend && \
             docker compose --env-file .env -f docker-compose.yml up -d backend && \
             docker compose --env-file .env -f docker-compose.yml exec backend python manage.py migrate --noinput && \
             docker compose --env-file .env -f docker-compose.yml exec backend python manage.py check && \
             echo \"Deployment successful: ${IMAGE_TAG}\""
      - name: Smoke test
        run: |
          ssh -i ~/.ssh/staging_deploy_key -o StrictHostKeyChecking=yes \
            ${{ vars.STAGING_USER }}@${{ vars.STAGING_HOST }} \
            "docker exec nqp-staging-backend curl -sf http://localhost:8000/api/v1/health/ || echo 'Health check failed'"
