name: Staging — Build, Publish & Deploy

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/anasshouran
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'

jobs:
  backend-tests:
    name: Backend — Django tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nqp_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: 'False'
      DB_NAME: nqp_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: '5432'
      REDIS_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt
      - name: Run migrations check
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python -m pytest apps -q --reuse-db

  frontend-checks:
    name: Frontend — typecheck + lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  build-backend-image:
    name: Build & publish backend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [backend-tests]
    outputs:
      image_tag: ${{ steps.tags.outputs.image_tag }}
      image_sha: ${{ steps.tags.outputs.image_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "image_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/nqp-backend:staging
            ${{ env.IMAGE_NAMESPACE }}/nqp-backend:${{ steps.tags.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deployment model: PULL-BASED
  # GitHub Actions cannot SSH to the staging VPS (port 22 blocked by
  # cloud provider firewall between Azure runners and SudaniCloud).
  # The staging VPS runs deploy-poll.sh (cron every 60s) which detects
  # new :staging tag on GHCR and deploys automatically.
  # This job verifies the image is published and reports the SHA.
  verify-image-published:
    name: Verify image published to GHCR
    runs-on: ubuntu-latest
    needs: [build-backend-image]
    environment: staging
    steps:
      - name: Verify GHCR image is accessible
        run: |
          IMAGE="${{ env.IMAGE_NAMESPACE }}/nqp-backend:${{ needs.build-backend-image.outputs.image_tag }}"
          echo "Verifying image: $IMAGE"
          # Check that the staging tag exists and is recent
          TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:anasshouran/nqp-backend:pull" | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/anasshouran/nqp-backend/manifests/${{ needs.build-backend-image.outputs.image_tag }}")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Image verified in GHCR: $IMAGE"
          else
            echo "✗ Image not found in GHCR (HTTP $HTTP_CODE)"
            exit 1
          fi
      - name: Report deployment status
        run: |
          echo "=== STAGING DEPLOYMENT STATUS ==="
          echo "Image: ghcr.io/anasshouran/nqp-backend:${{ needs.build-backend-image.outputs.image_tag }}"
          echo "Git SHA: ${{ needs.build-backend-image.outputs.image_sha }}"
          echo "Deployment method: pull-based (VPS cron poller)"
          echo "VPS will deploy within 60 seconds of image availability"
          echo "SSH from GitHub Actions: BLOCKED (cloud provider firewall)"
          echo "================================="
