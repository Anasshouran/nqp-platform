name: Mirror infrastructure images

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/anasshouran

jobs:
  mirror:
    name: Mirror base images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - source: postgres:16-alpine
            target: postgres:16-alpine
          - source: redis:7-alpine
            target: redis:7-alpine
          - source: minio/minio:latest
            target: minio:latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Mirror ${{ matrix.source }} -> ${{ matrix.target }}
        run: |
          docker pull "${{ matrix.source }}"
          docker tag "${{ matrix.source }}" "${{ env.IMAGE_NAMESPACE }}/${{ matrix.target }}"
          docker push "${{ env.IMAGE_NAMESPACE }}/${{ matrix.target }}"