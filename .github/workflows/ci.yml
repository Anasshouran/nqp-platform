name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/anasshouran

jobs:
  backend:
    name: Backend — Django tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nqp_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: 'False'
      DB_NAME: nqp_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: '5432'
      REDIS_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt
      - name: Run migrations check
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests (pytest — all apps)
        run: python -m pytest apps -q --reuse-db

  frontend:
    name: Frontend — typecheck + lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --run
      - name: Build (tsc + vite)
        run: npm run build

  docker:
    name: Build & publish images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          if [[ "${{ github.event_name }}" == "push" && \
                ( "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" ) ]]; then
            echo "main-branch=true" >> "$GITHUB_OUTPUT"
            echo "backend-tags=${{ env.IMAGE_NAMESPACE }}/afyatna-backend:dev,${{ env.IMAGE_NAMESPACE }}/afyatna-backend:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "frontend-tags=${{ env.IMAGE_NAMESPACE }}/afyatna-frontend:dev,${{ env.IMAGE_NAMESPACE }}/afyatna-frontend:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "main-branch=false" >> "$GITHUB_OUTPUT"
            echo "backend-tags=${{ env.IMAGE_NAMESPACE }}/afyatna-backend:pr-${{ github.event.pull_request.number || github.sha }}" >> "$GITHUB_OUTPUT"
            echo "frontend-tags=${{ env.IMAGE_NAMESPACE }}/afyatna-frontend:pr-${{ github.event.pull_request.number || github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.tags.outputs.backend-tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.tags.outputs.frontend-tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=https://api-dev.afyatna.com/api/v1