name: Mirror PostgreSQL image to GHCR

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/anasshouran
  SOURCE_IMAGE: postgres:16-alpine
  TARGET_IMAGE: postgres:16-alpine

jobs:
  mirror-postgres:
    name: Mirror PostgreSQL 16 Alpine
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror ${{ env.SOURCE_IMAGE }} -> ${{ env.IMAGE_NAMESPACE }}/${{ env.TARGET_IMAGE }}
        run: |
          docker pull "${{ env.SOURCE_IMAGE }}"
          docker tag "${{ env.SOURCE_IMAGE }}" "${{ env.IMAGE_NAMESPACE }}/${{ env.TARGET_IMAGE }}"
          docker push "${{ env.IMAGE_NAMESPACE }}/${{ env.TARGET_IMAGE }}"

      - name: Make package public (for anonymous VPS pulls)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/${TARGET_IMAGE%%:*}" \
            -d '{"visibility":"public"}'
          echo "Package visibility set to public"