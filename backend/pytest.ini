[pytest]
DJANGO_SETTINGS_MODULE = nqp_backend.settings
python_files = tests.py test_*.py *_tests.py
testpaths = apps
addopts = --import-mode=importlib --reuse-db

# سرّع إعادة تشغيل الاختبارات بإعادة استخدام قاعدة بيانات الاختبار بدلاً من
# إعادة بناء schema كاملة (~2-4 دقائق) في كل جلسة. لتجربة نظيفة استخدم:
#   python -m pytest apps -q --create-db
